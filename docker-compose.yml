version: '3.8'

services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password_123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  account-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_password_123
      POSTGRES_DB: account_ledger_db
    ports:
      - "5434:5432"
    volumes:
      - account_db_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - auth-db
    environment:
      - DATABASE_URL=postgresql+asyncpg://auth_user:auth_password_123@auth-db:5432/auth_db

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - account-db
    environment:
      - DATABASE_URL=postgresql+asyncpg://account_user:account_password_123@account-db:5432/account_ledger_db

volumes:
  auth_db_data:
  account_db_data: